<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5421a8">
  <meta name="description" content="Baston TV : collectionne des boxeurs, frappe les points faibles et fais grandir ta chaîne !">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Baston TV — Prototype 0.3</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">📺</span><div><strong>BASTON <span>TV</span></strong><small>Prototype 0.3</small></div></div>
      <div class="money" aria-label="Solde de pièces"><span aria-hidden="true">🪙</span><strong id="coins-live">600</strong></div>
    </header>
    <main id="screen" class="screen" aria-live="polite"></main>
    <nav class="navbar" aria-label="Navigation principale">
      <button class="nav-btn selected" type="button" data-view="home"><span aria-hidden="true">📺</span><small>TV</small></button>
      <button class="nav-btn" type="button" data-view="gym"><span aria-hidden="true">🥊</span><small>Entraîner</small></button>
      <button class="nav-btn" type="button" data-view="collection"><span aria-hidden="true">🧤</span><small>Vestiaires</small></button>
      <button class="nav-btn" type="button" data-view="combat"><span aria-hidden="true">⚔️</span><small>Combat</small></button>
      <button class="nav-btn" type="button" data-view="later"><span aria-hidden="true">🥚</span><small>À venir</small></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="./app.js"></script>
</body>
</html>
