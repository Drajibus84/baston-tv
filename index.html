<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5421a8">
  <meta name="description" content="Baston TV : collectionne des boxeurs, frappe les points faibles et fais grandir ta chaîne !">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Baston TV — Prototype 0.19</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">📺</span><div><strong>BASTON <span>TV</span></strong><small>Prototype 0.19</small></div></div>
      <div class="header-tools"><button class="settings-toggle" type="button" data-view="settings" title="Paramètres" aria-label="Ouvrir les paramètres">⚙️</button><button id="sound-toggle" class="sound-toggle" type="button" data-action="toggle-sound" aria-pressed="true" aria-label="Couper les sons" title="Activer ou couper les sons">🔊</button><div class="money gem-balance" aria-label="Solde de gemmes"><span aria-hidden="true">💎</span><strong id="gems-live">10</strong></div><div class="money" aria-label="Solde de pièces"><span aria-hidden="true">🪙</span><strong id="coins-live">600</strong></div></div>
    </header>
    <main id="screen" class="screen" aria-live="polite"></main>
    <nav class="navbar" aria-label="Navigation principale">
      <button class="nav-btn selected" type="button" data-view="home"><span aria-hidden="true">📺</span><small>TV</small></button>
      <button class="nav-btn" type="button" data-view="gym"><span aria-hidden="true">🥊</span><small>Entraîner</small></button>
      <button class="nav-btn" type="button" data-view="collection"><span aria-hidden="true">🧤</span><small>Vestiaires</small></button>
      <button class="nav-btn" type="button" data-view="combat"><span aria-hidden="true">⚔️</span><small>Combat</small></button>
      <button class="nav-btn" type="button" data-view="later"><span aria-hidden="true">🛒</span><small>Boutique</small></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog class="install-dialog" id="install-dialog" aria-labelledby="install-title"><h2 id="install-title">📱 Installer Baston TV</h2><div id="install-help"></div><form method="dialog"><button type="submit" class="install-close">Compris !</button></form></dialog>
  <dialog class="offline-dialog" id="offline-dialog" aria-labelledby="offline-title">
    <div class="offline-deco" aria-hidden="true">📺 🪙 ✨</div>
    <h2 id="offline-title">Bon retour sur Baston TV !</h2>
    <p>Les chaînes ont continué à rapporter des pièces pendant ton absence.</p>
    <div class="offline-duration">⏱ Absence comptabilisée : <strong id="offline-duration"></strong></div>
    <div class="offline-earnings"><small>Pièces gagnées</small><strong id="offline-total"></strong></div>
    <div id="offline-channels" class="offline-channels"></div>
    <p id="offline-cap-note" class="offline-note" hidden>Les gains hors ligne sont limités à 8 heures.</p>
    <form method="dialog"><button type="submit" class="action">Super, continuer ! 🥊</button></form>
  </dialog>
  <script defer src="./app.js"></script>
</body>
</html>
